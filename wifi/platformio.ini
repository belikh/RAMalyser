; Firmware for the optional Wi-Fi module: a Seeed XIAO ESP32-C6 on J8.
;
;   python3 ../web/build.py        # makes src/web_assets.h (not committed)
;   pio run -t upload              # with the module's own USB-C port
;
; NOT COMPILED OR RUN YET. The Arduino core for the ESP32-C6 comes from the
; pioarduino platform; the stock PlatformIO platform does not carry it.
[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
