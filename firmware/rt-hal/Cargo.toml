[package]
name = "rt-hal"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "RAMalyser base board drivers on embedded-hal traits (chip independent)"

[dependencies]
rt-core = { path = "../rt-core" }
embedded-hal = "1"

[features]
default = []
host = ["rt-core/sim"]     # in-memory display and screen previews on a PC

[[example]]
name = "lcd_preview"
required-features = ["host"]
